# Contrato do serviço, legível por máquina. Alimenta o OWNERS.md.
#
# `departments` é METADADO, não estrutura de pastas: os departamentos mudam mais
# depressa que o código, e a mesma automação serve mais do que um. As pastas dos
# serviços são por bounded context — quem se organiza por departamento é o
# frontend, porque é a navegação que o operador vê.
name: closing-reconciliation
context: Conciliação de fechos
port: 8001
database: mozaops_closing_reconciliation
role: closing_reconciliation
departments: [Meios de Pagamentos e Canais]
channels: [POS]
owner: <equipa>
routes: [/api/pos/validacao-credito-fecho]
