[project]
name = "mozaops-closing-credit-validation"
version = "0.0.0"
description = "Validação de crédito de fechos (POS, depois ATM/Quiosques): parse, reconciliação, persistência e relatório."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "mozaops-libs",
]

[tool.uv.sources]
mozaops-libs = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # A configuração dos dois vive no `backend/pyproject.toml`, para valer igual
    # em todos os serviços; aqui declara-se só que o serviço os instala.
    "ruff>=0.8",
    "mypy>=1.13",
    # O openpyxl não traz tipos; sem os stubs o mypy não vê a folha nem a célula
    # e a camada que lê os ficheiros ficava por verificar.
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
