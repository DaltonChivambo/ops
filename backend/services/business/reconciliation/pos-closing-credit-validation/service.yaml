# Contrato do serviço, legível por máquina. Alimenta o OWNERS.md.
#
# `area` é METADADO, não estrutura de pastas: as áreas mudam mais depressa que o
# código. A pasta diz o DEPARTAMENTO (Meios de Pagamentos e Canais — ADR 0004),
# que muda devagar; a área é mais fina do que o departamento — ver a nota
# abaixo — e quem se organiza por departamento/ilha é o frontend, porque é a
# navegação que o operador vê.
#
# A área é também a unidade de ACESSO: só entra aqui quem for desta. **Não é o departamento** (`payments-and-channels`, código GEEA 2350) —
# é a unidade orgânica real de quem trata dos canais, `CANAIS E SERVIÇOS DE
# INTEGRAÇÃO`, código GEEA 3230. O valor tem de ser igual ao `AUTH_SERVICE_AREA`
# do compose e ao id do catálogo do SPA — os três dizem a mesma coisa, e
# discordarem tira o acesso a toda a gente.
name: pos-closing-credit-validation
category: business/reconciliation
context: Validação de crédito de valores de fecho do POS

# `port` é a que o contentor escuta — a mesma do EXPOSE, do gunicorn e do
# `loadbalancer.server.port` do Traefik. A 8001 é só a publicação em
# desenvolvimento (`docker-compose.override.yml`), para o `ng serve` lhe chegar.
port: 8000
dev_port: 8001

area: channels
channels: [POS]
# O caminho público, visto de fora. O router monta em
# `/pos/validacao-credito-fecho`: o `/api` é a fronteira da API e é o Traefik
# que o corta.
routes: [/api/pos/validacao-credito-fecho]

# ─── Quem responde por isto ──────────────────────────────────────────────────
# `owner` é quem decide e a quem se pergunta; os outros dois registam quem fez o
# trabalho. São listas porque uma equipa cresce — hoje é uma pessoa só.
owner: Dalton Chivambo
developed_by: [Dalton Chivambo]
requirements_by: [Dalton Chivambo]

# ─── Infraestrutura ──────────────────────────────────────────────────────────
# Nome do serviço, da base e do role já dizem todos a mesma coisa — não há um
# nome antigo por migrar. (Houve, no serviço anterior — `closing_reconciliation`
# — e migrou-se junto com este rename, com os dados reais preservados.)
database: mozaops_pos_closing_credit_validation
role: pos_closing_credit_validation
env_prefix: DB_RECONCILIATION
