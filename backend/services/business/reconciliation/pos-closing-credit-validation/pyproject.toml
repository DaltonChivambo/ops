[project]
name = "mozaops-pos-closing-credit-validation"
version = "0.1.0"
description = "Validação de crédito de montantes de fechos de POS: parse, reconciliação, persistência e relatório."
# A mesma versão que a tag do `FROM` no Dockerfile: mudar uma é mudar a outra.
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Ler é com o calamine (Rust) e escrever é com o openpyxl: o relatório precisa
    # de estilos, imagens e formatação condicional, que o calamine não escreve.
    "python-calamine>=0.3",
    "openpyxl>=3.1",
    # O openpyxl só insere imagens (o logótipo do relatório) com o Pillow instalado.
    "pillow>=11.0",
    "python-multipart>=0.0.12",
    "mozaops-libs==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    # O openpyxl não traz tipos; sem os stubs o gerador do relatório ficava por
    # verificar. O calamine traz os seus.
    "types-openpyxl>=3.1",
]

[tool.uv]
package = false

# Os pacotes internos vêm de `wheels/` enquanto não houver onde os publicar.
# Quando estiverem no Nexus, sai esta secção e o `uv lock` vai buscá-los lá.
[tool.uv.sources]
mozaops-libs = { path = "wheels/mozaops_libs-0.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "ARG", "PTH", "BLE"]
ignore = [
    "S101",  # assert — os testes vivem disso
    "RUF001", "RUF002", "RUF003",  # os comentários são em português, com acentos
]

[tool.ruff.lint.isort]
# Sem isto o isort arruma `app` e `tests` entre as bibliotecas de terceiros.
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()`, `Query()` e companhia nos valores por omissão são a forma como se
# escreve FastAPI, não o argumento mutável que o B008 persegue.
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Cookie", "fastapi.Depends", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Path", "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "S105", "S106"]
"migrations/**" = ["E501", "ARG001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
