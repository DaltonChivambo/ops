# Contrato do serviço, legível por máquina. Agregado em docs/registry.md por
# `python scripts/gen_registry.py`.
#
# `departments` é METADADO, não estrutura de pastas (ADR 0004): os departamentos da Direção de
# Operações mudam mais depressa que o código, e um serviço serve mais do que um.
name: ticketing
context: Ticketing
port: 8002
schema: ticketing
profile: HTTP + publisher + consumidor
departments: [Meios de pagamentos e canais, Estrangeiro Garantias e Correspondentes, Clientes e Contas, Reconciliacao]
owner: <equipa>
publishes: [ticket.aberto, ticket.atribuido, ticket.resolvido]
consumes: [ativo.criado, ativo.actualizado, pedido.decidido]
