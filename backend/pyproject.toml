[project]
name = "mozaops-backend"
version = "0.0.0"
description = "Raiz do workspace uv — não é um pacote instalável, só agrega os membros."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs", "services/*"]

[tool.uv]
# `mozaops-libs` é resolvido a partir do workspace e não do índice público.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "ARG", "PTH"]
ignore = [
    "S101",  # assert — os testes vivem disso
    "RUF001", "RUF002", "RUF003",  # os comentários são em português, com acentos
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG001", "S105", "S106"]
"**/migrations/**" = ["E501", "ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pybreaker.*"]
ignore_missing_imports = true
