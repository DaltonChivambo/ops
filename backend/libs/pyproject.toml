[project]
name = "mozaops-libs"
version = "0.0.0"
description = "Utilitários técnicos partilhados entre serviços — como por exemplo a validação de tokens do GEEA."
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mozaops_libs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
