[project]
name = "mozaops-libs"
version = "0.1.0"
description = "Utilitários técnicos partilhados entre serviços — como por exemplo a validação de tokens do GEEA."
# Mais largo que o dos serviços: uma biblioteca serve quem estiver em qualquer
# versão suportada, e cada serviço escolhe a sua.
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mozaops_libs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "ARG", "PTH", "BLE"]
ignore = [
    "S101",  # assert — os testes vivem disso
    "RUF001", "RUF002", "RUF003",  # os comentários são em português, com acentos
]

[tool.ruff.lint.isort]
known-first-party = ["mozaops_libs", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Cookie", "fastapi.Depends", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Path", "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
