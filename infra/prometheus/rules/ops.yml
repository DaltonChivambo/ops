groups:
  - name: ops-servicos
    rules:
      - alert: ServicoEmBaixo
        expr: up{job="ops-services"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Serviço {{ $labels.service }} em baixo"
          description: "Prometheus não consegue raspar {{ $labels.instance }} há 2 minutos."

      - alert: TaxaDeErro5xxElevada
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "5xx acima de 5% em {{ $labels.service }}"

      - alert: FilaDeadLetterACrescer
        expr: rabbitmq_queue_messages{queue="ops.dead"} > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Mensagens na DLQ"
          description: "{{ $value }} mensagens em ops.dead — há um consumidor a falhar."
