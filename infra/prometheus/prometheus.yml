global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Cada serviço expõe /metrics via ops_common.observability
  - job_name: ops-services
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8001"]
        labels: { service: auth }
      - targets: ["ticketing:8002"]
        labels: { service: ticketing }
      - targets: ["asset:8003"]
        labels: { service: asset }
      - targets: ["approval:8004"]
        labels: { service: approval }
      - targets: ["notification:8005"]
        labels: { service: notification }
      - targets: ["reporting:8006"]
        labels: { service: reporting }

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
