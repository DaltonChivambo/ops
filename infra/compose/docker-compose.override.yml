# Desenvolvimento: hot-reload, código montado do host, caixa de correio local.
name: ops

services:
  auth:
    command: ["uvicorn", "auth.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ../../backend/services/auth/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common
      - ./keys:/run/keys:ro

  ticketing:
    command: ["uvicorn", "ticketing.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ../../backend/services/ticketing/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common

  asset:
    command: ["uvicorn", "asset.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ../../backend/services/asset/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common
      - asset-uploads:/var/lib/asset/uploads

  asset-scheduler:
    volumes:
      - ../../backend/services/asset/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common

  approval:
    command: ["uvicorn", "approval.main:app", "--host", "0.0.0.0", "--port", "8004", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ../../backend/services/approval/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common

  notification:
    command: ["uvicorn", "notification.main:app", "--host", "0.0.0.0", "--port", "8005", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ../../backend/services/notification/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common

  notification-worker:
    volumes:
      - ../../backend/services/notification/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common

  reporting:
    command: ["uvicorn", "reporting.main:app", "--host", "0.0.0.0", "--port", "8006", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ../../backend/services/reporting/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common

  reporting-worker:
    volumes:
      - ../../backend/services/reporting/src:/app/src
      - ../../backend/libs/ops_common/src/ops_common:/app/libs/ops_common/src/ops_common

  # Caixa de correio de dev: apanha o SMTP do Notification. UI em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ops-mailpit
    ports: ["8025:8025", "1025:1025"]
    networks: [ops]
