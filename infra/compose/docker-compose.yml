# Serviços aplicacionais. Requer a stack de infra a correr (docker-compose.infra.yml).
#
# CONTEXTO DE BUILD NA RAIZ DO MONOREPO (ADR 0005): é o que permite ao Dockerfile de cada
# serviço copiar backend/libs/ops_common. Consequência assumida: "docker build" a partir da
# pasta do serviço deixa de funcionar — todos os builds passam por aqui ou pelo Jenkins.
name: ops

networks:
  ops:
    name: ops
    external: true

volumes:
  asset-uploads:

x-service-base: &service-base
  restart: unless-stopped
  networks: [ops]

x-env-base: &env-base
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  GRAYLOG_HOST: graylog
  GRAYLOG_PORT: "12201"
  RABBITMQ_URL: amqp://ops:ops_dev_pw@rabbitmq:5672/
  RABBITMQ_EXCHANGE: ops.events
  JWKS_URL: http://auth:8001/api/v1/.well-known/jwks.json
  JWT_ISSUER: ops-auth
  JWT_AUDIENCE: ops-platform

services:
  auth:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/auth/Dockerfile
    container_name: ops-auth
    environment:
      <<: *env-base
      SERVICE_NAME: auth
      PORT: "8001"
      DATABASE_URL: postgresql+psycopg://auth_svc:auth_dev_pw@postgres:5432/ops
      DB_SCHEMA: auth
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt-public.pem
    volumes:
      - ./keys:/run/keys:ro
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8001/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5

  ticketing:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/ticketing/Dockerfile
    container_name: ops-ticketing
    environment:
      <<: *env-base
      SERVICE_NAME: ticketing
      PORT: "8002"
      DATABASE_URL: postgresql+psycopg://ticketing_svc:ticketing_dev_pw@postgres:5432/ops
      DB_SCHEMA: ticketing
      RABBITMQ_QUEUE: ticketing.events
      GRAFANA_WEBHOOK_TOKEN: ${TICKETING_GRAFANA_WEBHOOK_TOKEN:-token_dev}
    ports: ["8002:8002"]
    depends_on: [auth]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8002/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5

  asset:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/asset/Dockerfile
    container_name: ops-asset
    environment:
      <<: *env-base
      SERVICE_NAME: asset
      PORT: "8003"
      DATABASE_URL: postgresql+psycopg://asset_svc:asset_dev_pw@postgres:5432/ops
      DB_SCHEMA: asset
      UPLOAD_DIR: /var/lib/asset/uploads
      SCHEDULER_ENABLED: "false"
    volumes:
      - asset-uploads:/var/lib/asset/uploads
    ports: ["8003:8003"]
    depends_on: [auth]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8003/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5

  # Manutenção agendada: APScheduler, mesma imagem, entrypoint diferente.
  # Separa-se em serviço próprio se o volume o justificar (secção 3 do ARCHITECTURE.md).
  asset-scheduler:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/asset/Dockerfile
    container_name: ops-asset-scheduler
    command: ["python", "-m", "asset.scheduler"]
    environment:
      <<: *env-base
      SERVICE_NAME: asset-scheduler
      DATABASE_URL: postgresql+psycopg://asset_svc:asset_dev_pw@postgres:5432/ops
      DB_SCHEMA: asset
      SCHEDULER_ENABLED: "true"
    depends_on: [asset]

  approval:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/approval/Dockerfile
    container_name: ops-approval
    environment:
      <<: *env-base
      SERVICE_NAME: approval
      PORT: "8004"
      DATABASE_URL: postgresql+psycopg://approval_svc:approval_dev_pw@postgres:5432/ops
      DB_SCHEMA: approval
    ports: ["8004:8004"]
    depends_on: [auth]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8004/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5

  notification:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/notification/Dockerfile
    container_name: ops-notification
    environment:
      <<: *env-base
      SERVICE_NAME: notification
      PORT: "8005"
      DATABASE_URL: postgresql+psycopg://notification_svc:notification_dev_pw@postgres:5432/ops
      DB_SCHEMA: notification
      RABBITMQ_QUEUE: notification.events
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-ops@exemplo.local}
    ports: ["8005:8005"]

  # worker-first: o consumidor é o processo principal; o serviço HTTP acima só serve
  # /health e /metrics.
  notification-worker:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/notification/Dockerfile
    container_name: ops-notification-worker
    command: ["python", "-m", "notification.worker"]
    environment:
      <<: *env-base
      SERVICE_NAME: notification-worker
      DATABASE_URL: postgresql+psycopg://notification_svc:notification_dev_pw@postgres:5432/ops
      DB_SCHEMA: notification
      RABBITMQ_QUEUE: notification.events
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-ops@exemplo.local}
    depends_on: [notification]

  reporting:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/reporting/Dockerfile
    container_name: ops-reporting
    environment:
      <<: *env-base
      SERVICE_NAME: reporting
      PORT: "8006"
      DATABASE_URL: postgresql+psycopg://reporting_svc:reporting_dev_pw@postgres:5432/ops
      DB_SCHEMA: reporting
      RABBITMQ_QUEUE: reporting.events
    ports: ["8006:8006"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8006/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5

  reporting-worker:
    <<: *service-base
    build:
      context: ../..
      dockerfile: backend/services/reporting/Dockerfile
    container_name: ops-reporting-worker
    command: ["python", "-m", "reporting.worker"]
    environment:
      <<: *env-base
      SERVICE_NAME: reporting-worker
      DATABASE_URL: postgresql+psycopg://reporting_svc:reporting_dev_pw@postgres:5432/ops
      DB_SCHEMA: reporting
      RABBITMQ_QUEUE: reporting.events
    depends_on: [reporting]
