# Passo 01 do roadmap: infraestrutura de pé, sem código aplicacional.
#   docker compose -f infra/compose/docker-compose.infra.yml up -d
name: ops-infra

networks:
  ops:
    name: ops
    driver: bridge

volumes:
  pgdata:
  rabbitdata:
  promdata:
  grafanadata:
  mongodata:
  osdata:
  graylogdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-postgres
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops_admin
      POSTGRES_PASSWORD: ops_admin_dev_pw
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_admin -d ops"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ops
      RABBITMQ_DEFAULT_PASS: ops_dev_pw
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-ops.conf:ro
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus rabbitmq_management &&
             rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [ops]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ops-prometheus
    ports: ["9090:9090"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks: [ops]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ops-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafanadata:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [ops]

  mongo:
    image: mongo:6
    container_name: ops-mongo
    volumes: [mongodata:/data/db]
    networks: [ops]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: ops-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: [osdata:/usr/share/opensearch/data]
    networks: [ops]

  graylog:
    image: graylog/graylog:6.0
    container_name: ops-graylog
    environment:
      GRAYLOG_PASSWORD_SECRET: "mude_isto_em_producao_min_16_chars"
      GRAYLOG_ROOT_PASSWORD_SHA2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://127.0.0.1:9000/"
      GRAYLOG_MONGODB_URI: "mongodb://mongo:27017/graylog"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
    ports:
      - "9000:9000"
      - "12201:12201/udp"
    volumes: [graylogdata:/usr/share/graylog/data]
    depends_on: [mongo, opensearch]
    networks: [ops]
