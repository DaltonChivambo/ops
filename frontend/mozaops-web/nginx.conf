# O SPA compilado, servido por nginx atrás do Traefik.
#
# Este ficheiro vai para /etc/nginx/conf.d/default.conf e substitui o que a
# imagem traz. Só trata de ficheiros estáticos: o /api/** nunca chega aqui,
# porque o Traefik encaminha-o para os serviços antes deste container.

server {
    # 8080 e não 80: o processo corre como `nginx`, não como root, e abaixo de
    # 1024 seria preciso um privilégio que não há razão para dar. Quem publica
    # a porta 80 da máquina é o Traefik.
    #
    # Só IPv4 de propósito — a rede do Compose é IPv4, e um `listen [::]:8080`
    # rebenta o arranque num container sem IPv6.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nota: os logs mostram o IP do Traefik, não o do cliente. Corrigir isso
    # exige `set_real_ip_from` com a sub-rede do Compose — que é um valor real
    # a fixar quando houver ambiente de produção, não um palpite a deixar aqui.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Cabeçalhos que não custam nada e fecham três classes de ataque.
    # Uma Content-Security-Policy faria mais, mas o Angular injecta estilos
    # inline dos componentes: exige `style-src 'unsafe-inline'` ou nonces, e é
    # uma decisão a tomar com a Segurança — não um valor a adivinhar aqui.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Os ficheiros do build trazem hash no nome (`outputHashing: all` no
    # angular.json), por isso podem ser cacheados para sempre: um deploy novo
    # muda o nome do ficheiro, não o conteúdo do antigo. Regex tem prioridade
    # sobre o prefixo `/` abaixo, e é isso que faz esta regra ganhar.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|gif|ico)$ {
        # Um único add_header, e não `expires` mais `add_header`: as duas
        # directivas juntas emitem dois `Cache-Control` na mesma resposta.
        #
        # Sem `always` de propósito — assim o cabeçalho sai só nas respostas
        # 2xx/3xx. Com `always`, um ficheiro em falta devolvia um 404 marcado
        # como imutável, e o browser guardava o erro para sempre.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        # Deep links: `/pos/closing-credit-validation` não é um ficheiro, é uma
        # rota do Angular. Sem este fallback um F5 fora da raiz dá 404 — que é
        # exactamente o problema que trazer routing a sério veio resolver.
        try_files $uri $uri/ /index.html;

        # O index.html nunca se cacheia: é ele que aponta para os nomes com
        # hash. Cacheado, o browser serve um deploy antigo indefinidamente e
        # ninguém percebe porquê.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Se um pedido à API chegar aqui, o encaminhamento do Traefik está errado.
    # 404 explícito em vez do fallback acima — devolver o index.html a um
    # `fetch` dá "Unexpected token '<'" e uma hora a procurar no sítio errado.
    location /api/ {
        return 404;
    }
}
