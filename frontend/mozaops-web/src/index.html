<!doctype html>
<!-- lang="pt-PT": a interface é inteiramente em português europeu. O MozaOps v1
     tinha lang="en" numa UI portuguesa — leitores de ecrã e correctores seguem
     este atributo, e um erro aqui não é cosmético. -->
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>MozaOps</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Red Hat Text (corpo) e Red Hat Display (títulos) — a família da Red Hat,
       desenhada para interfaces densas e legível em corpos pequenos.
       Em produção convém servi-las do próprio domínio: um banco não deve
       depender de um CDN externo para a interface desenhar. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400..700&family=Red+Hat+Text:wght@400..700&display=swap"
  >
</head>
<body>
  <app-root></app-root>
</body>
</html>
