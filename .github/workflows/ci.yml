# Invoca o `make` e o `npm`, em vez de repetir os comandos: uma só definição do
# que é «verde».
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend (lock, ruff, mypy --strict, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cada pacote e cada serviço verificados à parte, pelos scripts de `ci/`.
      - run: make check

  frontend:
    name: frontend (vitest, build de produção)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
