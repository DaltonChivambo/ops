# MozaOps — infraestrutura local: entrada, base de dados, identidade,
# observabilidade e os serviços de negócio.
#
# Só para desenvolvimento. Cada serviço constrói a partir da sua própria pasta.
#
# De onde vêm as imagens e os pacotes decide-se no `.env`: vazio, do Docker Hub
# e do PyPI; na rede do banco, do Harbor e do Nexus (IMAGE_REGISTRY,
# IMAGE_NAMESPACE, PYPI_INDEX_URL, PYPI_TRUSTED_HOST). As tags ficam aqui.
#
#   docker compose up -d          sobe tudo
#   docker compose logs -f        acompanha
#   docker compose down -v        apaga TAMBÉM os volumes

name: mozaops

x-build-args: &build-args
  IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io}
  IMAGE_NAMESPACE: ${IMAGE_NAMESPACE:-library}
  PYPI_INDEX_URL: ${PYPI_INDEX_URL:-}
  PYPI_TRUSTED_HOST: ${PYPI_TRUSTED_HOST:-}

services:
  # ─── Entrada única ────────────────────────────────────────────────────────
  # O SPA e a API partilham origem por entrarem aqui: é o que dispensa CORS.
  traefik:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_NAMESPACE:-library}/traefik:v3.6
    container_name: mozaops-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"   # painel — só de localhost, nunca exposto
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      # Só de leitura: o Traefik precisa de descobrir containers, não de os criar.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mozaops]
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Serviços de negócio ──────────────────────────────────────────────────
  # Validação de crédito dos valores de fecho do POS.
  pos-closing-credit-validation:
    build:
      context: ./backend/services/business/reconciliation/pos-closing-credit-validation
      args: *build-args
    image: mozaops/pos-closing-credit-validation:local
    container_name: mozaops-pos-closing-credit-validation
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_RECONCILIATION_USER}:${DB_RECONCILIATION_PASSWORD}@postgres:5432/mozaops_pos_closing_credit_validation
      LOG_LEVEL: ${LOG_LEVEL}
      # Com default: um `.env` sem a variável daria string vazia num campo inteiro.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-64}
      # As mesmas variáveis, e o mesmo valor, que o `auth-service` recebe.
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      AUTH_ALLOWED_AZP: ${AUTH_ALLOWED_AZP}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-qa-mozaops}
      AUTH_AREAS: ${AUTH_AREAS:-channels:3230}
      AUTH_AREA_USERS: ${AUTH_AREA_USERS:-}
      # As únicas que diferem do `auth-service`: a área desta automação, e o id dela.
      AUTH_SERVICE_AREA: ${AUTH_SERVICE_AREA:-channels}
      AUTH_SERVICE_ID: ${AUTH_SERVICE_ID:-pos-closing-credit-validation}
    networks: [mozaops]
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # O `/api` é a fronteira da API e não parte do caminho que o serviço monta:
      # o stripprefix corta-o, como o `pathRewrite` do proxy.conf.json em dev.
      - traefik.http.routers.pos-closing-credit-validation.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/pos/validacao-credito-fecho`)
      - traefik.http.routers.pos-closing-credit-validation.entrypoints=web
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
      - traefik.http.routers.pos-closing-credit-validation.middlewares=api-strip
      - traefik.http.services.pos-closing-credit-validation.loadbalancer.server.port=8000

  # Sessões e áreas. O único que fala com o GEEA, e sem base de dados própria.
  auth-service:
    build:
      context: ./backend/services/platform/auth-service
      args: *build-args
    image: mozaops/auth-service:local
    container_name: mozaops-auth-service
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      AUTH_ALLOWED_AZP: ${AUTH_ALLOWED_AZP}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-qa-mozaops}
      AUTH_AREAS: ${AUTH_AREAS:-channels:3230}
      AUTH_AREA_USERS: ${AUTH_AREA_USERS:-}
      GEEA_SSOLOGIN_URL: ${GEEA_SSOLOGIN_URL}
      GEEA_TOKEN_URL: ${GEEA_TOKEN_URL}
      GEEA_REALM: ${GEEA_REALM}
      GEEA_CLIENT_ID: ${GEEA_CLIENT_ID}
      GEEA_CLIENT_SECRET: ${GEEA_CLIENT_SECRET}
      # `false` só enquanto o Traefik servir em claro.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_PATH: ${SESSION_COOKIE_PATH:-/api/auth-service}
      LOGIN_ATTEMPTS_PER_MINUTE: ${LOGIN_ATTEMPTS_PER_MINUTE:-10}
    networks: [mozaops]
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth-service.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/auth-service`)
      - traefik.http.routers.auth-service.entrypoints=web
      # O mesmo middleware do outro serviço.
      - traefik.http.routers.auth-service.middlewares=api-strip
      - traefik.http.services.auth-service.loadbalancer.server.port=8000

  # ─── Base de dados ────────────────────────────────────────────────────────
  # Uma base e um role por serviço, com as ligações cruzadas revogadas —
  # ver infra/postgres/initdb/01-create-databases.sh.
  postgres:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_NAMESPACE:-library}/postgres:18-alpine
    container_name: mozaops-postgres
    restart: unless-stopped
    # Sem isto corre com os valores de origem, onde ordenar 18 mil fechos vai a
    # disco. Estes são para uma máquina de desenvolvimento; num servidor sobem
    # com a memória — `shared_buffers` a ~25% da RAM é a regra.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      # Por operação de ordenação e por ligação: multiplica-se pelas ligações abertas.
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      # SSD: por omissão o planeador assume disco rotativo e prefere varrer.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_RECONCILIATION_USER: ${DB_RECONCILIATION_USER}
      DB_RECONCILIATION_PASSWORD: ${DB_RECONCILIATION_PASSWORD}
      DB_CASES_USER: ${DB_CASES_USER}
      DB_CASES_PASSWORD: ${DB_CASES_PASSWORD}
    volumes:
      # No PostgreSQL 18 o mount é em /var/lib/postgresql e não em .../data.
      # No caminho antigo o container recusa arrancar.
      - postgres-data:/var/lib/postgresql
      # Os scripts de initdb só correm quando o volume está vazio.
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [mozaops]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ─── Observabilidade ──────────────────────────────────────────────────────
  # Os serviços exportam para aqui e nunca directamente para o Jaeger.
  otel-collector:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_NAMESPACE:-otel}/opentelemetry-collector-contrib:0.144.0
    container_name: mozaops-otel
    restart: unless-stopped
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otel/collector.yaml:ro
    networks: [mozaops]
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_NAMESPACE:-jaegertracing}/jaeger:2.12.0
    container_name: mozaops-jaeger
    restart: unless-stopped
    networks: [mozaops]
    labels:
      - traefik.enable=true
      - traefik.http.routers.jaeger.rule=Host(`jaeger.${DOMAIN}`)
      - traefik.http.routers.jaeger.entrypoints=web
      - traefik.http.services.jaeger.loadbalancer.server.port=16686

networks:
  mozaops:
    name: mozaops

volumes:
  postgres-data:
    name: mozaops-postgres-data
