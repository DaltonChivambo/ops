# Serviço externo simulado, isolado do docker-compose.yml principal do
# MozaOps. Sobe-se à parte:
#
#   docker compose -f external-services/geea-keycloak/docker-compose.yml up -d

services:
  geea-keycloak:
    build: .
    image: geea-keycloak-mock
    container_name: geea-keycloak
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8100:8000"
